name: gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ripgrep and gitleaks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Generic leak gate (personal denylist runs only on the author's machine)
        run: |
          tools/check-public.sh --tree
          tools/check-public.sh --history
          # identity of the commits themselves
          bad="$(git log --all --format='%ae%n%ce' | sort -u | grep -Ev '^[0-9]+\+[A-Za-z0-9-]+@users\.noreply\.github\.com$' || true)"
          [ -z "$bad" ] || { echo "non-noreply commit emails found"; exit 1; }
