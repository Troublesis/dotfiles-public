include ./config/fonts.conf
include ./config/cursor.conf
include ./config/scrollback.conf
include ./config/mouse.conf
include ./config/performance.conf
include ./config/bell.conf
include ./config/window.conf
include ./config/tabbar.conf
include ./config/colors.conf
include ./config/shell.conf
include ./config/tweaks.conf
include ./config/mappings.conf

# 启动时的窗口大小（列数 × 行数）
# initial_window_width 1600
# initial_window_height 1000


# remember_window_size  yes   

# fullscreen yes

# Add padding around the edges
window_padding_width 10
# window_margin_width 8

enabled_layouts tall:bias=50;full_size=2;mirrored=false, splits
# enabled_layouts tall:bias=60;full_size=2;mirrored=false, grid, stack

hide_window_decorations no

# Misc
macos_option_as_alt yes
mouse_map left double press ungrabbed mouse_selection word

# include ./config/starup.conf
# enabled_layouts tall:bias=70;full_size=2
# enabled_layouts splits:split_axis=horizontal/
# You should configure this for whatever project you're working on
# startup_session ./config/startup.conf

# Allow the shell to set the window/tab title
allow_remote_control yes
shell_integration enabled

# scroll back lines
scrollback_lines -1

# To handle shell integration properly
macos_option_as_alt yes
# Keep kitty running after the last window closes. macOS Local Network privacy
# ties a tmux server to the kitty process that started it. If that kitty quits,
# every tmux pane loses LAN access (EHOSTUNREACH / ping timeouts) until
# `tmux kill-server`. See tmux_server_notice in ~/.zsh/os.zsh.
macos_quit_when_last_window_closed no
