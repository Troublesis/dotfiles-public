[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse 	 = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]

[input]
cursor_blink = true

# cd
cd_title  = "Change directory:"
cd_origin = "top-center"
cd_offset = [ 0, 2, 50, 3 ]

# create
create_title  = [ "Create:", "Create in:" ]
create_origin = "top-center"
create_offset = [ 0, 2, 50, 3 ]

# rename
rename_title  = "Rename:"
rename_origin = "hovered"
rename_offset = [ 0, 1, 50, 3 ]

# trash
trash_title 	= "Move {n} selected file{s} to trash? (y/N)"
trash_origin	= "top-center"
trash_offset	= [ 0, 2, 50, 3 ]

# delete
delete_title 	= "Delete {n} selected file{s} permanently? (y/N)"
delete_origin	= "top-center"
delete_offset	= [ 0, 2, 50, 3 ]

# filter
filter_title  = "Filter:"
filter_origin = "top-center"
filter_offset = [ 0, 2, 50, 3 ]

# find
find_title  = [ "Find next:", "Find previous:" ]
find_origin = "top-center"
find_offset = [ 0, 2, 50, 3 ]

# search
search_title  = "Search via {n}:"
search_origin = "top-center"
search_offset = [ 0, 2, 50, 3 ]

# shell
shell_title  = [ "Shell:", "Shell (block):" ]
shell_origin = "top-center"
shell_offset = [ 0, 2, 50, 3 ]

# overwrite
overwrite_title  = "Overwrite an existing file? (y/N)"
overwrite_origin = "top-center"
overwrite_offset = [ 0, 2, 50, 3 ]

# quit
quit_title  = "{n} task{s} running, sure to quit? (y/N)"
quit_origin = "top-center"
quit_offset = [ 0, 2, 50, 3 ]

[select]
open_title  = "Open with:"
open_origin = "hovered"
open_offset = [ 0, 1, 50, 7 ]

[which]
sort_by      	 = "none"
sort_sensitive = false
sort_reverse 	 = false
sort_translit  = false

[log]
enabled = false

[opener]
open-default = [ { run = 'open %s', orphan = true, desc = "Default app", for = "macos" } ]
open-preview = [ { run = 'open -a Preview %s', orphan = true, desc = "Preview", for = "macos" } ]
open-iina    = [ { run = 'open -a IINA %s', orphan = true, desc = "IINA", for = "macos" } ]
open-vscode  = [ { run = 'open -a "Visual Studio Code" %s', orphan = true, desc = "VS Code", for = "macos" } ]
open-sublime = [ { run = 'open -a "Sublime Text" %s', orphan = true, desc = "Sublime Text", for = "macos" } ]
open-qspace  = [ { run = 'open -a "QSpace Pro" %s', orphan = true, desc = "QSpace Pro", for = "macos" } ]
open-nvim    = [ { run = 'nvim %s', block = true, desc = "Neovim", for = "macos" } ]
reveal       = [ { run = 'open -R %s1', orphan = true, desc = "Reveal in Finder", for = "macos" } ]

[open]
prepend_rules = [
	{ url = "*", use = [ "open-default", "open-preview", "open-iina", "open-vscode", "open-sublime", "open-qspace", "open-nvim", "reveal" ] },
]
