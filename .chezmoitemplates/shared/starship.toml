{{- /*
  SHARED between the personal and work dotfiles repos (synced by .work-sync/sync.sh
  in the personal repo). Keep it free of secrets, personal hosts/IPs/emails/paths.
  Only use template data both repos define: .chezmoi.*, and `get . "hostclass"`.
  Rendered by:  personal dot_config/executable_starship.toml.tmpl
                work     dot_config/starship.toml.tmpl
*/ -}}
"$schema" = 'https://starship.rs/config-schema.json'
command_timeout = 2000
scan_timeout = 100

format = """
$username$hostname \
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python \
$conda \
$cmd_duration
$directory(peach) \
$line_break\
$git_branch(fg:yellow)\
$git_status(fg:yellow)\
$custom
$line_break\
$character"""

right_format = """
$time"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "fg:lavender"
style_root = "fg:lavender"
format = '[$user]($style)'

[hostname]
ssh_only = false
style = "fg:lavender"
format = '[@$hostname]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:rosewater"
format = '[[$time ](fg:rosewater)]($style)'

[directory]
style = "fg:peach"
format = "[$path]($style)"
truncation_length = 0
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:yellow"
format = '[[$symbol $branch](fg:yellow)]($style)'

[git_status]
style = "fg:yellow"
format = '[[($all_status$ahead_behind )](fg:yellow)]($style)'

[nodejs]
symbol = "js"
style = "fg:green"
format = '[[$symbol( $version) ](fg:green)]($style)'

[c]
symbol = "c"
style = "fg:green"
format = '[[$symbol( $version)](fg:green)]($style)'

[rust]
symbol = "rust"
style = "fg:green"
format = '[[$symbol( $version)](fg:green)]($style)'

[golang]
symbol = "go"
style = "bg:green"
format = '[[$symbol( $version)](fg:green)]($style)'

[php]
symbol = "php"
style = "fg:green"
format = '[[$symbol( $version)](fg:green)]($style)'

[java]
symbol = "java"
style = "fg:green"
format = '[[$symbol( $version)](fg:green)]($style)'

[kotlin]
symbol = "kotlin"
style = "fg:green"
format = '[[$symbol( $version)](fg:green)]($style)'

[haskell]
symbol = "haskell"
style = "fg:green"
format = '[[$symbol( $version)](fg:green)]($style)'

[python]
symbol = "py"
style = "fg:green"
format = '[[$symbol( $version)(\(#$virtualenv\))](fg:green)]($style)'

[docker_context]
symbol = "docker"
style = "fg:sapphire"
format = '[[$symbol( $context)](fg:sapphire)]($style)'

[conda]
symbol = "conda"
style = "fg:sapphire"
format = '[$symbol$environment]($style)'
ignore_base = false

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = "in $duration "
style = "fg:lavender"
disabled = false
show_notifications = true
min_time_to_notify = 45000

