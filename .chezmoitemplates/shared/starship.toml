{{/* Skipped on Windows: starship runs `when`/`command` through STARSHIP_SHELL (powershell
     there), i.e. it spawns a whole Windows PowerShell per prompt render (~1.5-3.5s here,
     which also trips command_timeout), and the POSIX `test` / `~` / `2>/dev/null` idioms
     below don't work in PowerShell anyway. */ -}}
{{ if ne .chezmoi.os "windows" -}}
[custom.chezmoi]
command = "git -C ~/.local/share/chezmoi symbolic-ref --short HEAD 2>/dev/null"
when = "test \"$HOME\" = \"$PWD\""
symbol = ""
style = "fg:yellow"
format = '[$symbol $output ]($style)'

{{ end -}}
