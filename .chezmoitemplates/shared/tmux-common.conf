{{- /*
  SHARED between the personal and work dotfiles repos (synced by .work-sync/sync.sh
  in the personal repo). Keep it free of secrets, personal hosts/IPs/emails/paths.
  Mouse/copy-mode, ALL key bindings, and the status bar for tmux-compatible
  multiplexers. Hotkeys here must stay mirrored in shared/herdr.toml.
  Call with the multiplexer name merged into the data:
    {{ template "shared/tmux-common.conf" (merge (dict "mux" "tmux") .) }}
  mux: "tmux" (macOS/Linux), "psmux" (Windows, reads ~/.tmux.conf), "rmux" (Windows, ~/.rmux.conf)
  Rendered by:  personal private_dot_tmux.conf.tmpl
                work     dot_rmux.conf.tmpl
*/ -}}
{{- $mux := .mux | default "tmux" -}}
{{- $conf := ternary "~/.rmux.conf" "~/.tmux.conf" (eq $mux "rmux") -}}
# -----------------------------------------------------------------------------
# 5. Mouse & copy-mode (vi)        [shared template: .chezmoitemplates/shared/tmux-common.conf]
# -----------------------------------------------------------------------------
set -g mouse on
setw -g mode-keys vi
set-option -g status-keys vi
{{ if ne $mux "psmux" -}}
set-window-option -g xterm-keys on
{{- end }}

bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y     send-keys -X copy-selection-and-cancel

# Keep selection visible after mouse release (do not auto-copy on drag)
unbind -T copy-mode-vi MouseDragEnd1Pane
bind   -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection

# -----------------------------------------------------------------------------
# 6. Key bindings   (mirrored in herdr: shared/herdr.toml)
# -----------------------------------------------------------------------------
# Reload config
unbind r
bind r source-file {{ $conf }} \; display-message "{{ base $conf | trimPrefix "." }} reloaded"

# Vim-style pane select (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Rearrange: prefix + H/J/K/L swaps the active pane with its neighbour in that
# direction. -d keeps focus on the moved pane (it follows the pane, not the slot).
# herdr equivalent: swap_pane_left/down/up/right.
bind H swap-pane -d -t '{left-of}'
bind J swap-pane -d -t '{down-of}'
bind K swap-pane -d -t '{up-of}'
bind L swap-pane -d -t '{right-of}'

# Splits preserve cwd
bind - split-window -v -c "#{pane_current_path}"
bind = split-window -h -c "#{pane_current_path}"

# Flip split orientation of existing panes (does NOT create a new pane)
#   prefix + | : arrange side-by-side  (top/bottom -> left/right)
#   prefix + _ : arrange stacked       (left/right -> top/bottom)
bind | select-layout even-horizontal \; display-message "layout: side-by-side"
bind _ select-layout even-vertical   \; display-message "layout: stacked"

# Resize via arrow keys (repeatable; unbinds default arrow pane-select)
unbind-key Left
bind-key -r Left  resize-pane -L 5
unbind-key Right
bind-key -r Right resize-pane -R 5
unbind-key Down
bind-key -r Down  resize-pane -D 5
unbind-key Up
bind-key -r Up    resize-pane -U 5

# Alt + arrow: select pane (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Shift + arrow: prev/next window (no prefix)
bind -n S-Left  previous-window
bind -n S-Right next-window

# Alt + H/L: prev/next window (no prefix)
bind -n M-H previous-window
bind -n M-L next-window

# Alt + digit: jump to window N
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Ctrl-Shift + arrow: swap panes
bind-key -n C-S-Up    swap-pane -U
bind-key -n C-S-Down  swap-pane -D
bind-key -n C-S-Left  swap-pane -t:-
bind-key -n C-S-Right swap-pane -t:+

# Alt-Shift + Left/Right: switch sessions
bind-key -n M-S-Left  switch-client -p
bind-key -n M-S-Right switch-client -n

# Prompts & misc
bind .     command-prompt
bind a     command-prompt
bind space list-keys
bind Tab   last-window   # not prefix+l: that would shadow select-pane -R
bind Enter break-pane
bind +     new-session
bind b     set-option status
bind n     command-prompt -p "rename window:"  "rename-window '%%'"
bind m     command-prompt -p "rename session:" "rename-session '%%'"

# Confirm before destructive actions
bind -n M-x confirm-before -p "kill-pane? (y/n)"   "kill-pane"
bind -n M-z confirm-before -p "kill-window? (y/n)" "kill-window"
bind Q      confirm-before -p "kill-session? (y/n)" kill-session

# Restore literal Ctrl-l to the shell (vim-tmux-navigator hijacks it by default;
# navigation goes through C-Right instead).
unbind-key -n C-l
bind-key   -n C-l send-keys C-l

# -----------------------------------------------------------------------------
# 7. Status bar
# -----------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify  left
# status-style (not the legacy status-bg/status-fg pair) renders on real tmux and
# tmux-compatible engines (psmux/rmux reject status-bg/status-fg).
set -g status-style     bg=colour233,fg=cyan
set -g status-interval 5
set -g status-left-length 30
set -g status-left  ""
set -g status-right " #[fg=colour250] #(whoami)@#H  "
set -g visual-activity off

setw -g window-status-format         "#[fg=colour246]#I #[fg=colour246]#W "
setw -g window-status-current-format "#[fg=black,bg=cyan,bold] #I #W "
setw -g window-status-current-style  none

set -g pane-border-style        fg=colour238
set -g pane-active-border-style fg=colour6
set -g message-style             fg=black,bg=blue
setw -g mode-style               bg=colour6,fg=colour0
